<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML tables</title>
</head>

<body>
    <h1>Hello world</h1>
    <p>Creating my first HTML table</p>

    <!-- call the table element -->
    <table style="width: 100%;">

        <!-- table head -->
        <thead>
            <tr>
                <th>Reg number</th>
                <th>Surname</th>
                <th>First Name</th>
                <th>Last Name</th>
            </tr>
        </thead>

        <!-- table body -->
        <tbody>
            <tr>
                <td style="text-align: center;">2026444290</td>
                <td style="text-align: center;">Jackson</td>
                <td style="text-align: center;">Michael</td>
                <td style="text-align: center;">Tochuckwu</td>
            </tr>

            <tr>
                <td style="text-align: center;">2026444291</td>
                <td style="text-align: center;">John</td>
                <td style="text-align: center;">Doe</td>
                <td style="text-align: center;">Sharp</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td style="text-align: center;">total</td>
                <td style="text-align: center;">2 students</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
